<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Nature Canopy Vibes</title>
  <style>
    /* Edge-to-edge, no chrome — critical for ceiling projection */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; }
    body { min-height: 100dvh; }
    canvas { display: block; }

    #qr-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: white;
      z-index: 9999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
        max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    }
    #qr-overlay.visible {
      opacity: 1;
      pointer-events: auto;
    }
    #qr-container {
      background: white;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 20px;
    }
    .qr-text {
      text-align: center;
      max-width: 600px;
      font-size: 1.2rem;
      line-height: 1.5;
    }
    .qr-subtext {
      margin-top: 15px;
      font-size: 0.9rem;
      color: #aaa;
      text-align: center;
    }

    @media (max-width: 520px), (max-height: 560px) {
      #qr-container {
        padding: 12px;
        margin-bottom: 14px;
      }
      #qr-container canvas,
      #qr-container img {
        width: min(62vw, 42vh, 256px) !important;
        height: min(62vw, 42vh, 256px) !important;
      }
      .qr-text {
        max-width: 32rem;
        font-size: clamp(0.95rem, 4.5vw, 1.1rem);
        line-height: 1.35;
      }
      .qr-subtext {
        margin-top: 10px;
        max-width: 30rem;
        font-size: 0.75rem;
        line-height: 1.35;
      }
    }
  </style>
</head>
<body>

  <div id="qr-overlay">
    <div id="qr-container">
      <canvas id="qr-canvas"></canvas>
    </div>
    <div class="qr-text">
      <strong>Scan to Control Projector</strong><br>
      Use your phone to change the location, weather, and time of day.
    </div>
    <div class="qr-subtext">
      Press 'q' or click anywhere to dismiss this screen. Press 'q' anytime to show it again.
    </div>
  </div>

  <!-- 1. p5.js — pinned version for Raspberry Pi stability.
       Vendored under vendor/ so a flaky kiosk WiFi can't black out the projector
       and so the GitHub Pages demo isn't at the mercy of CDN outages. -->
  <script src="vendor/p5.min.js"></script>

  <!-- PeerJS and QRCode for standalone WebRTC + QR overlay -->
  <script src="vendor/peerjs.min.js"></script>
  <script src="vendor/qrcode.min.js"></script>
  <!-- World coastlines for the journey map overlay (public domain, ~20 KB) -->
  <script src="vendor/world-land.js"></script>

  <!-- 2. Project config — Supabase credentials for cross-device remote control.
       No SDK needed: standalone.js uses raw WebSocket to Supabase Realtime. -->
  <script src="config.js"></script>

  <!-- Prefer the real server client. On static hosting it 404s, then the
       standalone fallback installs its browser-side transport. -->
  <script src="/socket.io/socket.io.js"></script>
  <script src="standalone.js"></script>

  <!-- 4. Visual subsystems (order matters: each builds on the previous) -->
  <script src="solar.js"></script>
  <script src="vendor/astronomy.browser.min.js"></script>
  <script src="vendor/satellite.min.js"></script>
  <script src="planetarium.js"></script>
  <script src="stars.js"></script>
  <script src="murmuration.js"></script>
  <script src="canopy.js"></script>
  <script src="creatures.js"></script>
  <script src="atmosphere.js"></script>

  <!-- 5. Control panel — injects its own DOM/CSS, exposes _ncv* globals -->
  <script src="controls.js"></script>

  <!-- 6. Main sketch — initialises everything, runs the render loop -->
  <!-- Safety net: standalone.js should have set window.io, but if anything prevented
       it from running (CSP, network error, etc.) this guarantees io() never throws. -->
  <script>
    if (!window.io) {
      window.io = function() {
        var ev = {};
        var sock = {
          id: 'offline', connected: false,
          on:   function(e, cb) { (ev[e] = ev[e] || []).push(cb); },
          emit: function() {}
        };
        // Fire 'connect' asynchronously so sketch.js behaves like it connected
        setTimeout(function() {
          (ev['connect'] || []).forEach(function(cb) { try { cb(); } catch(e) {} });
        }, 50);
        return sock;
      };
    }
  </script>
  <script src="sketch.js"></script>
  <script src="demo.js"></script>
  <script src="experiences.js"></script>
  <script src="cape.js"></script>
  <script src="conversations.js"></script>

</body>
</html>
